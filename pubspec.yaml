name: betrade
description: "BeTrade Project"
publish_to: 'none'
version: 1.0.0+5

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.0
  shared_preferences: ^2.2.2
  iconsax:
  camera: ^0.12.0+1
  http: ^1.2.0
  image_picker: ^1.1.2
  provider: ^6.1.5+1
  flutter_dotenv: ^6.0.0
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/logo/
    - .env

  fonts:
    - family: SFProRounded
      fonts:
        - asset: assets/fonts/SF-Pro-Rounded-Regular.ttf
          weight: 600

# ICON CONFIG (MAIN PART)
flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo/app_icon.png"

  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/logo/app_icon.png"