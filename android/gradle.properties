# org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# android.useAndroidX=true
# android.enableJetifier=true

# SSL flags: route Gradle's JVM TLS validation through the Windows
# certificate store (curl/SChannel can build the Google Maven chain
# fine — only the JDK's bundled cacerts can't) and skip OCSP/CRL
# revocation checks (some ISPs — e.g. Reliance — block the revocation
# endpoints, leaving the JVM unable to verify even valid certificates).
# Without these, `flutter build apk` fails with `PKIX path building
# failed` when fetching newly-added Maven artifacts.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Djavax.net.ssl.trustStoreType=Windows-ROOT -Dcom.sun.net.ssl.checkRevocation=false
android.useAndroidX=true
android.enableJetifier=true
org.gradle.parallel=false
org.gradle.workers.max=2

# Disable Kotlin incremental compilation. The pub cache lives on C: while
# this project is on D:, and Kotlin's RelocatableFileToPathConverter can't
# compute relative paths across Windows drives, so every plugin compile
# fails with "this and base files have different roots". Turning off
# incremental compilation forces full builds each time -- slower but
# actually works on cross-drive setups.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
