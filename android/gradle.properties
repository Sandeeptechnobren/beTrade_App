# org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# android.useAndroidX=true
# android.enableJetifier=true

org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
org.gradle.parallel=false
org.gradle.workers.max=2

# Disable Kotlin incremental compilation. The pub cache lives on C: while
# this project is on D:, and Kotlin's RelocatableFileToPathConverter can't
# compute relative paths across Windows drives, so every plugin compile
# fails with "this and base files have different roots". Turning off
# incremental compilation forces full builds each time -- slower but
# actually works on cross-drive setups.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
